<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support – #{{ short_id|default('Ticket') }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  </head>
  <body class="flex flex-col h-screen bg-gray-50">
    <header class="bg-blue-600 text-white p-3 text-center shadow">
      <h1>User Chat – Ticket #{{ short_id }}</h1>
    </header>

    <div
      id="chatBox"
      class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-100"
    ></div>

    <form
      id="replyForm"
      class="bg-white border-t p-3 flex items-center space-x-2"
    >
      <textarea
        id="replyText"
        rows="1"
        placeholder="Type a message..."
        class="flex-1 border rounded-full px-3 py-2 text-sm resize-none"
        required
      ></textarea>
      <button type="submit" class="bg-blue-500 text-white rounded-full p-3">
        Send
      </button>
    </form>

    <script>
      const socket = io({ transports: ["websocket"] });
      const room = "{{ short_id }}";
      socket.emit("join", { room });

      function addBubble(text, sender, time) {
        const isUser = sender === "user";
        const box = document.getElementById("chatBox");
        const bubble = `
        <div class="flex ${isUser ? "justify-end" : "justify-start"} mb-3">
          <div class="max-w-[75%] p-2 rounded-lg ${
            isUser ? "bg-blue-200" : "bg-gray-200"
          }">
            ${text}
            <div class="text-xs text-gray-600 mt-1 text-right">${time}</div>
          </div>
        </div>`;
        box.insertAdjacentHTML("beforeend", bubble);
        box.scrollTop = box.scrollHeight;
      }

      socket.on("new_message", (data) => {
        addBubble(data.text, data.sender, data.time);
      });

      document.getElementById("replyForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const txt = document.getElementById("replyText").value.trim();
        if (!txt) return;
        document.getElementById("replyText").value = "";
        const time = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        addBubble(txt, "user", time);
        socket.emit("message", { room, text: txt, sender: "user" });
      });
    </script>
  </body>
</html>
