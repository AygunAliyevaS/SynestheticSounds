<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>User Chat #{{ short_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  </head>
  <body class="flex flex-col h-screen bg-gray-50">
    <header class="bg-blue-600 text-white p-3 text-center">
      <h1>User Chat – #{{ short_id }}</h1>
    </header>
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <form id="msgForm" class="p-3 bg-white border-t flex gap-2">
      <input
        id="msgInput"
        class="flex-1 border rounded-full px-4 py-2"
        placeholder="Type..."
        required
      />
      <button
        type="submit"
        class="bg-blue-600 text-white px-5 py-2 rounded-full"
      >
        Send
      </button>
    </form>

    <!-- templates/support_chat.html -->
    <script>
      const socket = io();
      const room = "{{ short_id }}";
      socket.emit("join", {room});

      function addMsg(text, sender, time) {
        // User messages: right, blue
        // Support/Admin messages: left, gray
        const isUser = sender === "user";
        const align = isUser ? "justify-end" : "justify-start";
        const bg = isUser ? "bg-blue-200" : "bg-gray-200";

        const box = document.getElementById("chatBox");
        box.insertAdjacentHTML("beforeend", `
          <div class="flex ${align} mb-2">
            <div class="max-w-xs p-3 rounded-lg ${bg}">
              ${text}
              <div class="text-xs text-right mt-1">${time}</div>
            </div>
          </div>`);
        box.scrollTop = box.scrollHeight;
      }

      {% for msg in chat %}
        {% if msg.text and msg.sender and msg.time %}
          addMsg("{{ msg.text|e }}", "{{ msg.sender }}", "{{ msg.time[11:16] }}");
        {% endif %}
      {% endfor %}

      socket.on("new_message", data => addMsg(data.text, data.sender, data.time));

      document.getElementById("msgForm").onsubmit = e => {
        e.preventDefault();
        const txt = document.getElementById("msgInput").value.trim();
        if (!txt) return;
        document.getElementById("msgInput").value = "";
        const time = new Date().toTimeString().slice(0,5);
        addMsg(txt, "user", time);
        socket.emit("message", {room, text: txt, sender: "user"});
      };
    </script>
  </body>
</html>
