<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support – #{{ short_id }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .msg-bubble {min-height:44px;position:relative;padding:10px 14px 20px 14px;border-radius:1.3rem;}
    .msg-user {background:#DCF8C6;border-top-right-radius:0;}
    .msg-admin {background:#FFFFFF;border-top-left-radius:0;}
    .msg-time {position:absolute;bottom:4px;right:10px;font-size:11px;color:#666;}
  </style>
</head>
<body class="flex flex-col h-screen m-0 p-0">

  <!-- Header (same for both) -->
  <header class="bg-[#075E54] text-white p-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <a href="{{ url_for('support') if not session.get('is_admin') else url_for('admin') }}" class="text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <div class="flex items-center space-x-2">
        <div class="w-10 h-10 rounded-full bg-[#128C7E] flex items-center justify-center font-bold text-lg">
          {{ short_id[0]|upper }}
        </div>
        <div>
          <p class="font-semibold">Ticket #{{ short_id }}</p>
          <p class="text-xs opacity-80">{{ category }} • {{ status }}</p>
        </div>
      </div>
    </div>
    <div class="flex items-center space-x-3 text-sm">
      {% if user %}
        <span class="hidden sm:inline">Hi, {{ user.name }}</span>
        <a href="/logout" class="hover:underline">Logout</a>
      {% else %}
        <a href="/auth" class="hover:underline">Login</a>
      {% endif %}
    </div>
  </header>

  <!-- Chat area -->
  <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4" style="max-height:calc(100vh-120px);"></div>

  <!-- Input -->
  <form id="replyForm" class="bg-[#F0F0F0] border-t border-gray-300 p-3 flex items-center space-x-2">
    <div class="flex-1 bg-white rounded-full shadow-sm flex items-center px-3 py-2">
      <textarea id="replyText" rows="1" placeholder="Type a message..."
                class="flex-1 resize-none border-none outline-none text-sm text-gray-800" required></textarea>
    </div>
    <button type="submit"
            class="bg-[#25D366] hover:bg-[#1EBE5D] text-white rounded-full p-3 shadow-md transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
      </svg>
    </button>
  </form>

<script>
  const shortId = "{{ short_id }}";
  const isAdmin = {{ "true" if session.get('is_admin') else "false" }};

  // ---- escape HTML -------------------------------------------------
  function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

  // ---- add a bubble ------------------------------------------------
  function addBubble(msg){
    const box = document.getElementById('chatBox');
    const isUser = msg.sender === 'user';
    const text  = isUser ? msg.user : msg.assistant;
    const time  = msg.time ? msg.time.split('T')[1].slice(0,5) : 'Now';
    const html = `
      <div class="flex ${isUser?'justify-end':'justify-start'} mb-3">
        <div class="max-w-[75%]">
          <div class="msg-bubble ${isUser?'msg-user':'msg-admin'} text-gray-900 shadow-sm">
            ${escapeHtml(text)}
            <div class="msg-time">${time}</div>
          </div>
        </div>
      </div>`;
    box.insertAdjacentHTML('beforeend', html);
    box.scrollTop = box.scrollHeight;
  }

  // ---- load historic messages ---------------------------------------
  {% if chat %}
    {% for m in chat %}
      addBubble({{ m|tojson }});
    {% endfor %}
  {% endif %}

  // ---- SSE – use **absolute** URL (works on Azure) -----------------
  const es = new EventSource("{{ url_for('stream_chat', short_id=short_id, _external=True) }}");
  es.onmessage = e => addBubble(JSON.parse(e.data));
  es.onerror = () => { console.warn('SSE error'); es.close(); setTimeout(()=>{location.reload();},2000); };

  // ---- send reply ---------------------------------------------------
  async function sendReply(){
    const txt = document.getElementById('replyText').value.trim();
    if(!txt) return;
    document.getElementById('replyText').value='';

    // optimistic UI
    const now = new Date().toISOString();
    addBubble({time:now, sender:isAdmin?'support':'user',
               user:isAdmin?null:txt, assistant:isAdmin?txt:null});

    await fetch(`/api/support/${shortId}/reply`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({reply:txt})
    });
  }
  document.getElementById('replyForm').onsubmit = e=>{e.preventDefault();sendReply();};
</script>
</body>
</html>
