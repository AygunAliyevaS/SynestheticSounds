{% extends "base.html" %}
{% block title %}Support – #{{ short_id }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-4">
    <h2 class="text-2xl font-bold mb-2">Ticket #{{ short_id }}</h2>
    <p class="text-sm text-gray-600 mb-4">
        Category: {{ category }} – Status: <strong>{{ status }}</strong>
    </p>

    <div id="chatBox" class="chat-box mb-4"></div>

    <form id="replyForm" class="flex gap-2">
        <input type="text" id="replyInput"
               class="flex-1 p-2 border rounded"
               placeholder="Type your message…" required>
        <button type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded">
            Send
        </button>
    </form>
</div>

<script>
/* ----- Safe way to inject Flask variables into JS ----- */
const SHORT_ID = "{{ short_id }}";

function escapeHtml(t){
    const d=document.createElement('div');
    d.textContent=t;
    return d.innerHTML;
}

function render(chat){
    const box=document.getElementById('chatBox');
    box.innerHTML='';
    chat.forEach(m=>{
        const time=new Date(m.time).toLocaleString();
        const isUser = m.sender==='user';
        const text = isUser ? m.user : m.assistant;
        const bubble = `<div class="msg-bubble">${escapeHtml(text)}</div>
                        <div class="msg-time">${time}</div>`;
        box.innerHTML += `<div class="msg ${isUser?'msg-user':'msg-admin'}">${bubble}</div>`;
    });
    box.scrollTop = box.scrollHeight;
}

async function loadChat(){
    const resp = await fetch(`/api/support/${SHORT_ID}`);
    const data = await resp.json();
    render(data.chat);
}

async function sendReply(){
    const txt = document.getElementById('replyInput').value.trim();
    if(!txt) return;

    await fetch(`/api/support/${SHORT_ID}/reply`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({reply: txt})
    });

    document.getElementById('replyInput').value = '';
    loadChat();
}

/* ----- Form handling ----- */
document.getElementById('replyForm').onsubmit = e => {
    e.preventDefault();
    sendReply();
};

/* ----- Initial load & auto-refresh ----- */
loadChat();
setInterval(loadChat, 7000);
</script>
{% endblock %}
