<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Chat – Ticket {{ short_id }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    .msg-admin {
      background-color: #f3f4f6;
      border-radius: 1rem;
      padding: 0.5rem 1rem;
    }
    .msg-user {
      background-color: #2563eb;
      color: white;
      border-radius: 1rem;
      padding: 0.5rem 1rem;
    }
    .msg-time {
      font-size: 0.7rem;
      color: #9ca3af;
      text-align: right;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen">
  <header class="bg-white border-b px-6 py-3 flex items-center justify-between">
    <h1 class="text-lg font-semibold text-gray-800">
      Admin Chat – Ticket #{{ short_id }}
    </h1>
    <a href="/admin" class="text-blue-600 hover:underline">← Back to Tickets</a>
  </header>

  <main id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-3">
    {% for msg in chat %}
      <div class="flex {% if msg.sender == 'admin' %}justify-end{% else %}justify-start{% endif %}">
        <div class="max-w-[70%]">
          <div class="{% if msg.sender == 'admin' %}msg-user{% else %}msg-admin{% endif %}">
            {{ msg.text or msg.assistant }}
            <div class="msg-time">{{ msg.time }}</div>
          </div>
        </div>
      </div>
    {% endfor %}
  </main>

  <form id="replyForm" class="bg-white border-t flex p-4">
    <input id="replyText" type="text" placeholder="Type your reply..." 
      class="flex-1 border rounded-lg px-4 py-2 mr-3 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    <button type="submit" 
      class="bg-blue-600 text-white rounded-lg px-6 py-2 hover:bg-blue-700">Send</button>
  </form>

  <script>
    const socket = io();
    const room = "{{ short_id }}";

    socket.emit("join", { room });

    function addBubble(text, sender, time) {
      const isAdmin = sender === "admin";
      const box = document.getElementById("chatBox");
      const bubble = `
      <div class="flex ${isAdmin ? "justify-end" : "justify-start"} mb-3">
        <div class="max-w-[75%]">
          <div class="${isAdmin ? "msg-user" : "msg-admin"}">
            ${text}
            <div class="msg-time">${time}</div>
          </div>
        </div>
      </div>`;
      box.insertAdjacentHTML("beforeend", bubble);
      box.scrollTop = box.scrollHeight;
    }

    socket.on("new_message", (data) => {
      addBubble(data.text, data.sender, data.time);
    });

    document.getElementById("replyForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const txt = document.getElementById("replyText").value.trim();
      if (!txt) return;
      document.getElementById("replyText").value = "";
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      addBubble(txt, "admin", time);
      socket.emit("message", { room, text: txt, sender: "admin" });
    });
  </script>
</body>
</html>
