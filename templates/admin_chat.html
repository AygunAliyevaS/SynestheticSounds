{# --------------------------------------------------------------- #}
{#  templates/admin_chat.html  –  Admin chat view                 #}
{# --------------------------------------------------------------- #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin – #{{ short_id }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    .msg-bubble {
      min-height: 44px;
      position: relative;
      padding: 10px 14px 20px 14px;
      border-radius: 1.3rem;
    }
    .msg-user   { background:#DCF8C6; border-top-right-radius:0; }
    .msg-admin  { background:#FFFFFF; border-top-left-radius:0; }
    .msg-time   {
      position:absolute; bottom:4px; right:10px;
      font-size:11px; color:#666; line-height:1;
    }
  </style>
</head>
<body class="flex flex-col h-screen bg-gray-50">

  <header class="bg-green-700 text-white p-3 flex justify-between items-center">
    <h1>Admin – #{{ short_id }}</h1>
    <a href="/admin" class="underline text-sm">Back</a>
  </header>

  <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

  <form id="msgForm" class="p-3 bg-white border-t flex gap-2">
    <input id="msgInput"
           class="flex-1 border rounded-full px-4 py-2"
           placeholder="Reply..." required />
    <button type="submit"
            class="bg-green-600 text-white px-5 py-2 rounded-full">
      Send
    </button>
  </form>

  <script>
    const socket = io();
    const room = "{{ short_id }}";

    socket.emit("join", {room});

    function addMsg(text, sender, time) {
      const isAdmin = (sender === "admin" || sender === "support");
      const align   = isAdmin ? "justify-end" : "justify-start";
      const bubble  = isAdmin ? "msg-admin" : "msg-user";

      const html = `
        <div class="flex ${align} mb-3">
          <div class="max-w-[75%]">
            <div class="msg-bubble ${bubble} text-gray-900 shadow-sm">
              ${escapeHtml(text)}
              <div class="msg-time">${time}</div>
            </div>
          </div>
        </div>`;

      document.getElementById('chatBox').insertAdjacentHTML('beforeend', html);
      document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    /* ---- Load existing messages ---- */
    {% for msg in chat %}
      {% if msg.user %}
        addMsg("{{ msg.user|e }}", "user", "{{ msg.time.split('T')[1][:5] }}");
      {% endif %}
      {% if msg.assistant %}
        addMsg("{{ msg.assistant|e }}", "admin", "{{ msg.time.split('T')[1][:5] }}");
      {% endif %}
    {% endfor %}

    /* ---- Real-time ---- */
    socket.on("new_message", data => {
      addMsg(data.text, data.sender, data.time);
    });

    document.getElementById('msgForm').onsubmit = e => {
      e.preventDefault();
      const txt = document.getElementById('msgInput').value.trim();
      if (!txt) return;
      document.getElementById('msgInput').value = "";
      const now = new Date().toTimeString().slice(0,5);
      addMsg(txt, "admin", now);
      socket.emit("message", {room, text: txt, sender: "admin"});
    };
  </script>
</body>
</html>
