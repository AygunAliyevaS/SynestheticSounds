<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Chat – Ticket #{{ short_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      .msg-bubble {
        min-height: 44px;
        position: relative;
        padding: 10px 14px 20px 14px;
        border-radius: 1.3rem;
      }
      .msg-admin {
        background: #dcf8c6;
        border-top-right-radius: 0;
      }
      .msg-user {
        background: #ffffff;
        border-top-left-radius: 0;
      }
      .msg-time {
        position: absolute;
        bottom: 4px;
        right: 10px;
        font-size: 11px;
        color: #666;
        line-height: 1;
      }
    </style>
  </head>
  <body class="flex flex-col h-screen bg-gray-50">
    <header
      class="bg-[#0b4f3e] text-white p-3 flex justify-between items-center shadow"
    >
      <h1 class="text-lg font-semibold">Admin Chat – Ticket #{{ short_id }}</h1>
      <a href="/admin" class="underline text-sm">← Back to Admin Panel</a>
    </header>

    <div
      id="chatBox"
      class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-100"
    ></div>

    <form
      id="replyForm"
      class="bg-white border-t p-3 flex items-center space-x-2"
    >
      <textarea
        id="replyText"
        rows="1"
        placeholder="Type a message..."
        class="flex-1 border rounded-full px-3 py-2 text-sm resize-none"
        required
      ></textarea>
      <button type="submit" class="bg-[#25D366] text-white rounded-full p-3">
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
          />
        </svg>
      </button>
    </form>

    <script>

   socket.on('connect', () => console.log('Connected to SocketIO'));
   socket.on('connect_error', (err) => console.error('Connection error:', err));
   socket.on('disconnect', (reason) => console.log('Disconnected:', reason));
      
      const socket = io({ transports: ["websocket"] });
      const room = "{{ short_id }}";
      socket.emit("join", { room });

      function addBubble(text, sender, time) {
        const isAdmin = sender === "admin";
        const box = document.getElementById("chatBox");
        const bubble = `
        <div class="flex ${isAdmin ? "justify-end" : "justify-start"} mb-3">
          <div class="max-w-[75%]">
            <div class="msg-bubble ${
              isAdmin ? "msg-admin" : "msg-user"
            } shadow-sm text-gray-900">
              ${text}
              <div class="msg-time">${time}</div>
            </div>
          </div>
        </div>`;
        box.insertAdjacentHTML("beforeend", bubble);
        box.scrollTop = box.scrollHeight;
      }

      socket.on("new_message", (data) => {
        addBubble(data.text, data.sender, data.time);
      });

      document.getElementById("replyForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const txt = document.getElementById("replyText").value.trim();
        if (!txt) return;
        document.getElementById("replyText").value = "";
        const time = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        addBubble(txt, "admin", time);
        socket.emit("message", { room, text: txt, sender: "admin" });
      });
    </script>
  </body>
</html>
