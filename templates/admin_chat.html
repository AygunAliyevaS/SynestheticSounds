{% extends "base.html" %}
{% block title %}Admin – #{{ short_id }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto p-4">
    <h2 class="text-2xl font-bold mb-2">Admin Chat – #{{ short_id }}</h2>
    <p class="text-sm text-gray-600 mb-4">
        User: <strong>{{ user_email }}</strong> |
        Category: {{ category }} |
        Status: <strong>{{ status }}</strong>
    </p>

    <div id="chatBox" class="chat-box mb-4"></div>

    <form id="replyForm" class="flex gap-2">
        <input type="text" id="replyInput"
               class="flex-1 p-2 border rounded"
               placeholder="Reply as support…" required>
        <button type="submit"
                class="bg-green-600 text-white px-4 py-2 rounded">
            Reply
        </button>
    </form>
</div>

<script>
function escapeHtml(t){
    const d=document.createElement('div'); d.textContent=t; return d.innerHTML;
}
function render(chat){
    const box=document.getElementById('chatBox');
    box.innerHTML='';
    chat.forEach(m=>{
        const time=new Date(m.time).toLocaleString();
        const isAdmin = m.sender==='support';
        const bubble = `<div class="msg-bubble">${escapeHtml(isAdmin?m.assistant:m.user)}</div>
                        <div class="msg-time">${time}</div>`;
        box.innerHTML += `<div class="msg ${isAdmin?'msg-admin':'msg-user'}">${bubble}</div>`;
    });
    box.scrollTop=box.scrollHeight;
}
async function loadChat(){
    const r=await fetch(`/api/support/{{ short_id }}`);
    const d=await r.json();
    render(d.chat);
}
async function sendReply(){
    const txt=document.getElementById('replyInput').value.trim();
    if(!txt) return;
    await fetch(`/admin/chat/{{ short_id }}/reply`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({reply:txt})
    });
    document.getElementById('replyInput').value='';
    loadChat();
}
document.getElementById('replyForm').onsubmit=e=>{e.preventDefault();sendReply();}
loadChat();
setInterval(loadChat,5000);
</script>
{% endblock %}
