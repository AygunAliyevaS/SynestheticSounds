<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Support Ticket</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-center mb-6">Open a Support Ticket</h1>

    <form id="ticketForm">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Your Email</label>
        <input type="email" name="user_email" required
               class="w-full border rounded px-3 py-2" placeholder="you@example.com"
               value="">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Category</label>
        <select name="category" required class="w-full border rounded px-3 py-2">
          <option value="">-- Choose --</option>
          <option>Billing</option>
          <option>Technical</option>
          <option>Feature Request</option>
          <option>Other</option>
        </select>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium mb-1">Message</label>
        <textarea name="user_message" rows="4" required
                  class="w-full border rounded px-3 py-2"
                  placeholder="Describe your issue…"></textarea>
      </div>

      <button type="submit"
              class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
        Submit Ticket
      </button>
    </form>

    <div id="result" class="mt-4 hidden"></div>
  </div>

  <script>
    // ---- pre-fill email if the user is logged in (client-side) ----
    const loggedInEmail = "{{ user.email if user else '' }}";
    if (loggedInEmail) {
      document.querySelector('input[name="user_email"]').value = loggedInEmail;
    }

    document.getElementById('ticketForm').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());

      const res = await fetch('/api/support', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });

      const json = await res.json();
      const result = document.getElementById('result');
      result.classList.remove('hidden');

      if (!res.ok) {
        result.innerHTML = `<p class="text-red-600">${json.error}</p>`;
        return;
      }

      result.innerHTML = `
        <p class="text-green-600">Ticket created! <strong>#${json.short_id}</strong></p>
        <p><a href="${json.chat_url}" class="text-blue-600 underline">Open chat</a></p>
      `;
    };
  </script>
</body>
</html>
